name: CI

# Checks every pull request, and every push to a branch other than dev (dev is deployed by deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: [dev]

# Read-only: CI never publishes anything.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # pnpm's version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check, hints included
        run: pnpm check
      - name: Build the site
        run: pnpm build
        env:
          # The build asks GitHub for Callout's latest release. A token keeps shared runners from being rate limited.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Unit tests
        run: pnpm test
      # @playwright/test is pinned to the version whose Chromium this installs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
